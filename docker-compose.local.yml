name: intelligent-course-system-local

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-course_db}
      MYSQL_USER: ${DB_USERNAME:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  neo4j-init:
    image: neo4j:5.11
    restart: "no"
    user: "neo4j"
    volumes:
      - neo4j_data:/data
      - ./scripts/neo4j-backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -d /data/databases/neo4j ]; then
          neo4j-admin database load --from-path=/backups neo4j --overwrite-destination=true
        fi

  neo4j:
    image: neo4j:5.11
    restart: unless-stopped
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    tmpfs:
      - /var/lib/neo4j/run
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p '${NEO4J_PASSWORD:-neo4j123}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  recommend-service:
    build:
      context: .
      dockerfile: recommend-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RECOMMEND_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-course_db}
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}
    healthcheck:
      test: ["CMD-SHELL", "/opt/conda/envs/lab_autumn/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/model/status', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: ${APP_TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-course_db}
      DB_USERNAME: ${DB_USERNAME:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      RECOMMEND_SERVICE_URL: http://recommend-service:8000
      VIDEO_DIR: /app/videos
      VIDEO_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      FFPROBE_PATH: /usr/bin/ffprobe
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-mock}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:8088,http://127.0.0.1:8088}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - ${VIDEO_HOST_DIR:-/home/shiyang/code_space/course_videos}:/app/videos
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health || true); test \"$$code\" = \"200\" -o \"$$code\" = \"401\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
